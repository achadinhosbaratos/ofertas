name: Robô de achadinhos

on:
  schedule:
    - cron: "47 14 * * *"   # 11:47 (Brasília): 1º vídeo
    - cron: "47 15 * * *"   # 12:47: reserva do 1º vídeo
    - cron: "47 18 * * *"   # 15:47 (Brasília): 2º vídeo
    - cron: "47 19 * * *"   # 16:47: reserva do 2º vídeo
    - cron: "47 22 * * *"   # 19:47 (Brasília): 3º vídeo
    - cron: "47 23 * * *"   # 20:47: reserva do 3º vídeo
  workflow_dispatch:         # botão "Run workflow" pra rodar na hora
    inputs:
      modo:
        description: "postar = próximo vídeo do dia · completo = gera até 3 vídeos"
        type: choice
        default: postar
        options: [postar, completo]

permissions:
  contents: write   # salvar histórico, ofertas e a fila do dia
  actions: read     # recuperar artefatos temporários de execuções anteriores
  pages: write      # publicar a página de ofertas
  id-token: write

concurrency:
  group: robo       # nunca roda duas vezes ao mesmo tempo
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo   # datas e "preço visto em" no horário de Brasília

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar vídeos pendentes de execução anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/videos
          RUN_ANTERIOR=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=videos-pendentes&per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$GITHUB_REF_NAME\") | .workflow_run.id" | head -n 1)
          if [ -n "$RUN_ANTERIOR" ]; then
            echo "Recuperando vídeos da execução $RUN_ANTERIOR"
            gh run download "$RUN_ANTERIOR" --name videos-pendentes --dir site/videos
          else
            echo "Sem vídeos pendentes arquivados nesta branch."
          fi
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-inter || true
          if ! fc-list | grep -qi "Inter Display"; then
            curl -sL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
            unzip -q -o /tmp/inter.zip -d /tmp/inter
            mkdir -p ~/.fonts && cp /tmp/inter/extras/otf/InterDisplay-*.otf ~/.fonts/ && fc-cache -f > /dev/null
          fi
          pip install -q requests pillow numpy edge-tts gTTS

      - name: Rodar o robô
        env:
          SITE_GA4_ID: ${{ vars.SITE_GA4_ID }}
          SHOPEE_FEED_URL: ${{ secrets.SHOPEE_FEED_URL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}   # seu ID de afiliado da Shopee
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_IA_MAX_POR_DIA: ${{ vars.VIDEO_IA_MAX_POR_DIA }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_AUTH_MODE: ${{ vars.INSTAGRAM_AUTH_MODE }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_COMENTAR_LINK: ${{ vars.INSTAGRAM_COMENTAR_LINK }}
          INSTAGRAM_PUBLICAR: 'nao'  # bloqueio preventivo até concluir o teste de um Reel  # chave do Instagram (sem ela, não posta lá)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ORIGEM: ${{ github.event_name }}                 # "schedule" = horário automático
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ]; then
            MODO=postar
          fi
          echo "Modo: $MODO"
          python bot.py "$MODO"

      - name: Preparar a página
        if: always() && hashFiles('site/index.html') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar a página
        id: publicar
        if: always() && hashFiles('site/index.html') != ''
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Postar no Instagram
        if: always()
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_AUTH_MODE: ${{ vars.INSTAGRAM_AUTH_MODE }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_COMENTAR_LINK: ${{ vars.INSTAGRAM_COMENTAR_LINK }}
          INSTAGRAM_PUBLICAR: 'nao'  # bloqueio preventivo até concluir o teste de um Reel
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORIGEM: ${{ github.event_name }}
          TEM_GH_PAT: ${{ secrets.GH_PAT_SEGREDOS != '' && 'sim' || '' }}
        run: python bot.py instagram

      - name: Postar no YouTube Shorts
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py youtube

      - name: Limpar vídeos que não precisam de reenvio
        if: always()
        run: python bot.py limpar-videos

      - name: Preservar MP4 pendentes por quatro dias
        if: always() && hashFiles('site/videos/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: videos-pendentes
          path: site/videos/*.mp4
          retention-days: 4
          compression-level: 0
      - name: Salvar a chave renovada do Instagram
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SEGREDOS }}   # token do GitHub com permissão de mudar segredos
        run: |
          f="$RUNNER_TEMP/instagram_token_novo.txt"
          [ -s "$f" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::A chave do Instagram mudou na renovação, mas falta o segredo GH_PAT_SEGREDOS pra salvar."
          else
            gh secret set INSTAGRAM_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "Chave do Instagram salva."
          fi
          rm -f "$f"

      - name: Guardar histórico, ofertas, fila e redes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add -A aceita arquivos que ainda não existem e registra remoções.
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "Histórico sem mudanças."
          else
            git commit -m "robô $(date +%F) $(date +%H:%M)"
            git pull --rebase
            git push
          fi
