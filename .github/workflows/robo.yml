name: Robô de achadinhos

on:
  schedule:
    - cron: "47 10 * * *"   # 07:47 (Brasília): kit do dia no Telegram (fotos + texto pro Flow)
    - cron: "47 11 * * *"   # 08:47: reserva do kit (só age se o das 07:47 não chegou)
    - cron: "47 14 * * *"   # 11:47 (Brasília): monta e entrega o 1º vídeo
    - cron: "47 15 * * *"   # 12:47: reserva (só posta se o das 11:47 não saiu)
    - cron: "47 22 * * *"   # 19:47 (Brasília): monta e entrega o 2º vídeo
    - cron: "47 23 * * *"   # 20:47: reserva (só posta se o das 19:47 não saiu)
  workflow_dispatch:         # botão "Run workflow" pra rodar na hora
    inputs:
      modo:
        description: "postar = próximo vídeo do dia · kit = manda o kit de novo · completo = jeito antigo, sem Flow"
        type: choice
        default: postar
        options: [postar, kit, completo]

permissions:
  contents: write   # salvar histórico, ofertas e a fila do dia
  pages: write      # publicar a página de ofertas
  id-token: write

concurrency:
  group: robo       # nunca roda duas vezes ao mesmo tempo
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo   # datas e "preço visto em" no horário de Brasília

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-inter || true
          if ! fc-list | grep -qi "Inter Display"; then
            curl -sL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
            unzip -q -o /tmp/inter.zip -d /tmp/inter
            mkdir -p ~/.fonts && cp /tmp/inter/extras/otf/InterDisplay-*.otf ~/.fonts/ && fc-cache -f > /dev/null
          fi
          pip install -q requests pillow numpy edge-tts gTTS

      - name: Rodar o robô
        env:
          SHOPEE_FEED_URL: ${{ secrets.SHOPEE_FEED_URL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}   # seu ID de afiliado da Shopee
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # IA do Google que escreve os roteiros
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}  # chave do Instagram (sem ela, não posta lá)
          ORIGEM: ${{ github.event_name }}                 # "schedule" = horário automático
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ]; then
            case "${{ github.event.schedule }}" in
              "47 10 * * *"|"47 11 * * *") MODO=kit ;;
              *) MODO=postar ;;
            esac
          fi
          echo "Modo: $MODO"
          python bot.py "$MODO"

      - name: Preparar a página
        if: always() && hashFiles('site/index.html') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar a página
        id: publicar
        if: always() && hashFiles('site/index.html') != ''
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Postar no Instagram
        if: always()
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORIGEM: ${{ github.event_name }}
          TEM_GH_PAT: ${{ secrets.GH_PAT_SEGREDOS != '' && 'sim' || '' }}
        run: python bot.py instagram

      - name: Salvar a chave renovada do Instagram
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SEGREDOS }}   # token do GitHub com permissão de mudar segredos
        run: |
          f="$RUNNER_TEMP/instagram_token_novo.txt"
          [ -s "$f" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::A chave do Instagram mudou na renovação, mas falta o segredo GH_PAT_SEGREDOS pra salvar."
          else
            gh secret set INSTAGRAM_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "Chave do Instagram salva."
          fi
          rm -f "$f"

      - name: Guardar histórico, ofertas, fila e redes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json ofertas.json fila.json redes.json 2>/dev/null || true
          git commit -m "robô $(date +%F) $(date +%H:%M)" || echo "nada novo"
          git pull --rebase --autostash || true
          git push || echo "não deu pra salvar"
