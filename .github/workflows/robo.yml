name: Robô de achadinhos

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests pillow edge-tts gTTS

      - name: Rodar o robô
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python bot.py

      - name: Guardar histórico (pra não repetir produto)
        if: always()
        run: |
          git config user.name "robo-achadinhos"
          git config user.email "robo@users.noreply.github.com"
          git add historico.json || true
          git commit -m "histórico $(date +%F)" || echo "nada novo"
          git push || echo "não deu pra salvar o histórico"
