name: Testar feed

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler o começo do feed e mandar o resumo no Telegram
        env:
          FEED: ${{ secrets.SHOPEE_FEED_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'FIM'
          import csv, io, os, re, json, zlib, urllib.request, urllib.parse

          def mandar(texto):
              url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage"
              for i in range(0, len(texto), 3800):
                  dados = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                                                  "text": texto[i:i + 3800],
                                                  "disable_web_page_preview": "true"}).encode()
                  urllib.request.urlopen(url, data=dados, timeout=30)

          feed = os.environ.get("FEED", "").strip()
          if not feed:
              mandar("Teste do feed: falta o segredo SHOPEE_FEED_URL no GitHub.")
              raise SystemExit(1)
          try:
              req = urllib.request.Request(feed, headers={"User-Agent": "Mozilla/5.0"})
              r = urllib.request.urlopen(req, timeout=60)
              bruto = r.read(400_000)
              h = r.headers
          except Exception as e:
              mandar(f"Teste do feed: não consegui baixar ({e}).")
              raise SystemExit(1)

          tamanho = h.get("Content-Length")
          tamanho = f"{int(tamanho) / 1e6:.0f} MB" if tamanho else "desconhecido"
          nome = re.findall(r'filename\*?=(?:UTF-8\'\')?"?([^";]+)', h.get("Content-Disposition", ""))
          if bruto[:2] == b"\x1f\x8b":
              tipo, bruto = "gzip", zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(bruto)
          elif bruto[:2] == b"PK":
              mandar(f"Teste do feed: veio um ZIP ({tamanho}). Me avise que eu ajusto.")
              raise SystemExit(0)
          else:
              tipo = "texto"
          texto = bruto.decode("utf-8-sig", errors="replace")
          cab = texto.split("\n", 1)[0]
          sep = max([",", ";", "\t", "|"], key=cab.count)
          linhas = list(csv.reader(io.StringIO(texto), delimiter=sep))
          colunas, exemplos = linhas[0], linhas[1:3]

          out = [f"Feed OK ✅",
                 f"Arquivo: {nome[0] if nome else '?'}",
                 f"Tamanho: {tamanho} ({tipo}, separador {sep!r})",
                 f"Colunas: {len(colunas)}", ""]
          for i, c in enumerate(colunas):
              ex = exemplos[0][i] if exemplos and i < len(exemplos[0]) else ""
              ex = re.sub(r"\s+", " ", ex)[:70]
              out.append(f"{i + 1}. {c} = {ex}")
          mandar("\n".join(out))
          print("\n".join(out))
          FIM
